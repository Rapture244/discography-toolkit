repos:
  # ================================================================================================================== #
  #                                                       RUFF                                                        #
  # ================================================================================================================== #
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22   # run `prek auto-update` periodically, this pin goes stale
    hooks:
      # Linter, with safe autofix
      - id: ruff-check
        args: ["--fix"]

      # Formatter (style only, like Black)
      - id: ruff-format

  # ================================================================================================================== #
  #                                                   BASEDPYRIGHT                                                    #
  # ================================================================================================================== #
  - repo: https://github.com/DetachHead/basedpyright-prek-mirror
    rev: 1.39.9    # no 'v' prefix — basedpyright's own version scheme
    hooks:
      - id: basedpyright
        name: basedpyright (type checking)
        pass_filenames: true                       # analyze only staged files
        args: ["--project", "pyrightconfig.json"]
